name: Keep Alive (API & Supabase)

on:
  schedule:
    # Pokreće se na svaka 4 sata kako bi i API ostao budan (Cloud Run se brzo uspavljuje)
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Google Cloud Run API
        run: |
          # Koristimo -X GET i povlačimo stvarne podatke da pokrenemo backend
          curl -X GET https://zoranstepanoski-prof-api-yqiyrjxyeq-lm.a.run.app/api/skills

      - name: Ping Supabase Database Directly
        run: |
          # Direktno buđenje Supabase baze podataka
          curl -X GET "https://supabase.co*" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
