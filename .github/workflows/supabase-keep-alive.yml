name: Keep Alive (API & Supabase)

on:
  schedule:
    # Pokreće se na svaka 4 sata kako bi i API ostao budan (Cloud Run se brzo uspavljuje)
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Google Cloud Run API
        run: |
          # Koristimo -s za tihi režim i šaljemo GET zahtev na Cloud Run API
          curl -s -X GET https://zoranstepanoski-prof-api-yqiyrjxyeq-lm.a.run.app/api/skills

      - name: Ping Supabase Database Directly
        run: |
          # Šaljemo upit na neku stvarnu tabelu u vašoj bazi kako bi Supabase registrovao aktivnost.
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/about_me?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
